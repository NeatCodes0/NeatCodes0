name: Update Monkeytype Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Stats and Update README
        run: |
          API_KEY="${{ secrets.MONKEYTYPE_API_KEY }}"
          TIME_RES=$(curl -s -H "Authorization: ApeKey $API_KEY" "https://api.monkeytype.com/users/personalBests?mode=time")
          WORD_RES=$(curl -s -H "Authorization: ApeKey $API_KEY" "https://api.monkeytype.com/users/personalBests?mode=words")

          # Time Modes
          T15_W=$(echo "$TIME_RES" | jq -r '.data["15"][0].wpm // "-"')
          T15_A=$(echo "$TIME_RES" | jq -r '.data["15"][0].acc // "-"')
          T15="${T15_W}wpm_${T15_A}%25"

          T30_W=$(echo "$TIME_RES" | jq -r '.data["30"][0].wpm // "-"')
          T30_A=$(echo "$TIME_RES" | jq -r '.data["30"][0].acc // "-"')
          T30="${T30_W}wpm_${T30_A}%25"

          T60_W=$(echo "$TIME_RES" | jq -r '.data["60"][0].wpm // "-"')
          T60_A=$(echo "$TIME_RES" | jq -r '.data["60"][0].acc // "-"')
          T60="${T60_W}wpm_${T60_A}%25"

          T120_W=$(echo "$TIME_RES" | jq -r '.data["120"][0].wpm // "-"')
          T120_A=$(echo "$TIME_RES" | jq -r '.data["120"][0].acc // "-"')
          T120="${T120_W}wpm_${T120_A}%25"

          # Words Modes
          W10_W=$(echo "$WORD_RES" | jq -r '.data["10"][0].wpm // "-"')
          W10_A=$(echo "$WORD_RES" | jq -r '.data["10"][0].acc // "-"')
          W10="${W10_W}wpm_${W10_A}%25"

          W25_W=$(echo "$WORD_RES" | jq -r '.data["25"][0].wpm // "-"')
          W25_A=$(echo "$WORD_RES" | jq -r '.data["25"][0].acc // "-"')
          W25="${W25_W}wpm_${W25_A}%25"

          W50_W=$(echo "$WORD_RES" | jq -r '.data["50"][0].wpm // "-"')
          W50_A=$(echo "$WORD_RES" | jq -r '.data["50"][0].acc // "-"')
          W50="${W50_W}wpm_${W50_A}%25"

          W100_W=$(echo "$WORD_RES" | jq -r '.data["100"][0].wpm // "-"')
          W100_A=$(echo "$WORD_RES" | jq -r '.data["100"][0].acc // "-"')
          W100="${W100_W}wpm_${W100_A}%25"

          # Build Badge String
          BADGES="[![15s](https://img.shields.io/badge/15s-${T15}-blueviolet)](https://monkeytype.com/) "
          BADGES+="[![30s](https://img.shields.io/badge/30s-${T30}-blue)](https://monkeytype.com/) "
          BADGES+="[![60s](https://img.shields.io/badge/60s-${T60}-green)](https://monkeytype.com/) "
          BADGES+="[![120s](https://img.shields.io/badge/120s-${T120}-yellow)](https://monkeytype.com/) "
          BADGES+="&nbsp;&nbsp;&nbsp;&nbsp;" 
          BADGES+="[![10w](https://img.shields.io/badge/10w-${W10}-red)](https://monkeytype.com/) "
          BADGES+="[![25w](https://img.shields.io/badge/25w-${W25}-orange)](https://monkeytype.com/) "
          BADGES+="[![50w](https://img.shields.io/badge/50w-${W50}-purple)](https://monkeytype.com/) "
          BADGES+="[![100w](https://img.shields.io/badge/100w-${W100}-pink)](https://monkeytype.com/)"

          # Replace in README
          sed -i "s|<!-- MONKEYTYPE_BADGE -->.*|<!-- MONKEYTYPE_BADGE --> $BADGES|" README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update detailed monkeytype stats"
