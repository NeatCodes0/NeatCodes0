name: Update Monkeytype Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Stats and Update README
        env:
          API_KEY: ${{ secrets.MONKEYTYPE_API_KEY }}
        run: |
          python3 -c '
          import json, os, urllib.request, re

          api_key = os.environ["API_KEY"]
          time_url = "https://api.monkeytype.com/users/personalBests?mode=time"
          word_url = "https://api.monkeytype.com/users/personalBests?mode=words"

          def get_stats(url):
              req = urllib.request.Request(url, headers={"Authorization": f"ApeKey {api_key}"})
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          try:
              time_data = get_stats(time_url)
              word_data = get_stats(word_url)

              badges = []
              
              # Time Modes
              for mode, color in [("15", "blueviolet"), ("30", "blue"), ("60", "green"), ("120", "yellow")]:
                  if mode in time_data.get("data", {}) and time_data["data"][mode]:
                      wpm = time_data["data"][mode][0]["wpm"]
                      acc = time_data["data"][mode][0]["acc"]
                      badges.append(f"[![{mode}s](https://img.shields.io/badge/{mode}s-{wpm}wpm_{acc}%25-{color})](https://monkeytype.com/)")
              
              badges.append("<br>") # THIS ADDS A LINE BREAK
              
              # Words Modes
              for mode, color in [("10", "red"), ("25", "orange"), ("50", "purple"), ("100", "pink")]:
                  if mode in word_data.get("data", {}) and word_data["data"][mode]:
                      wpm = word_data["data"][mode][0]["wpm"]
                      acc = word_data["data"][mode][0]["acc"]
                      badges.append(f"[![{mode}w](https://img.shields.io/badge/{mode}w-{wpm}wpm_{acc}%25-{color})](https://monkeytype.com/)")

              badge_string = "\n".join(badges) # Proper markdown formatting
              
              with open("README.md", "r") as f:
                  content = f.read()
              
              content = re.sub(r"<!-- MONKEYTYPE_BADGE -->.*", f"<!-- MONKEYTYPE_BADGE -->\n{badge_string}", content)
              
              with open("README.md", "w") as f:
                  f.write(content)
                  
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          '

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update detailed monkeytype stats"
