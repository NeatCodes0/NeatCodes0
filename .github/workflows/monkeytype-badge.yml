name: Update Monkeytype Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Stats and Update README
        env:
          API_KEY: ${{ secrets.MONKEYTYPE_API_KEY }}
        run: |
          python3 -c '
          import json, os, urllib.request, re

          api_key = os.environ["API_KEY"]
          time_url = "https://api.monkeytype.com/users/personalBests?mode=time"
          word_url = "https://api.monkeytype.com/users/personalBests?mode=words"
          
          # Tumhari profile ka link (Username change karna ho toh yahan badal lena)
          PROFILE_URL = "https://monkeytype.com/profile/toxicSnail"

          def get_stats(url):
              req = urllib.request.Request(url, headers={"Authorization": f"ApeKey {api_key}"})
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          try:
              time_data = get_stats(time_url)
              word_data = get_stats(word_url)

              badges = []
              
              # Time Modes
              badges.append("**Time:**")
              for mode, color in [("15", "blueviolet"), ("30", "blue"), ("60", "green"), ("120", "yellow")]:
                  if mode in time_data.get("data", {}) and time_data["data"][mode]:
                      wpm = int(time_data["data"][mode][0]["wpm"])
                      acc = int(time_data["data"][mode][0]["acc"])
                      # URL mein ?logo=monkeytype add kiya aur link profile ka kar diya
                      badges.append(f"[![{mode}s](https://img.shields.io/badge/{mode}s-{wpm}wpm_{acc}%25-{color}?logo=monkeytype&logoColor=white)]({PROFILE_URL})")
              
              badges.append("<br>") 
              
              # Words Modes
              badges.append("**Words:**")
              for mode, color in [("10", "red"), ("25", "orange"), ("50", "purple"), ("100", "pink")]:
                  if mode in word_data.get("data", {}) and word_data["data"][mode]:
                      wpm = int(word_data["data"][mode][0]["wpm"])
                      acc = int(word_data["data"][mode][0]["acc"])
                      badges.append(f"[![{mode}w](https://img.shields.io/badge/{mode}w-{wpm}wpm_{acc}%25-{color}?logo=monkeytype&logoColor=white)]({PROFILE_URL})")

              badge_string = " ".join(badges) # Space se separate kiya
              badge_string = badge_string.replace("<br> ", "<br>\n") # Line break properly handle kiya
              
              with open("README.md", "r") as f:
                  content = f.read()
              
              content = re.sub(r"<!-- MONKEYTYPE_BADGE -->.*", f"<!-- MONKEYTYPE_BADGE -->\n{badge_string}", content, flags=re.DOTALL)
              
              with open("README.md", "w") as f:
                  f.write(content)
                  
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          '

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: make monkeytype badges pro"
